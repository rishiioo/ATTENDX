<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATTENDX - Teacher Dashboard</title>
    <link rel="stylesheet" href="teacher.css" />
  </head>
  <body>
    <nav class="navbar">
      <h2>ATTENDX Teacher Panel</h2>
      <button class="logout-btn">Logout</button>
    </nav>

    <div class="dashboard">
      <div class="card">
        <h3>Attendance Details</h3>

        <label>Select Subject</label>
        <select id="subject">
          <option value="">Select Subject</option>
          <option value="Mathematics">Mathematics</option>
          <option value="C Programming">Problem Solving Using C</option>
          <option value="Statistics">Statistics</option>
          <option value="Entrepreneurship">Business Entrepreneurship</option>
          <option value="EVS">EVS</option>
          <option value="Electronics">Electronics Basic</option>
        </select>

        <label>Select Date</label>
        <input type="date" id="date" />
      </div>

      <div class="card">
        <h3>Student List</h3>

        <div class="student-list">
          <div class="student">
            <span>Rishi Singh (Roll 71)</span>
            <input type="checkbox" checked />
          </div>

          <div class="student">
            <span>Amit Kumar (Roll 1)</span>
            <input type="checkbox" checked />
          </div>

          <div class="student">
            <span>Priya Sharma (Roll 12)</span>
            <input type="checkbox" />
          </div>

          <div class="student">
            <span>Rahul Verma (Roll 23)</span>
            <input type="checkbox" checked />
          </div>

          <div class="student">
            <span>Sneha Patel (Roll 34)</span>
            <input type="checkbox" />
          </div>

          <div class="student">
            <span>Vikram Singh (Roll 45)</span>
            <input type="checkbox" />
          </div>
        </div>
      </div>

      <button class="submit-btn">Submit Attendance</button>
    </div>

    <script src="teacher.js"></script>
  </body>
</html>
