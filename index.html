<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATTENDX Login</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <form class="login-card" id="loginForm">
        <h2 class="logo">ATTEND<span>X</span></h2>
        <p class="subtitle">Attendance Management System</p>

        <div class="role-selector">
          <input
            type="radio"
            name="userType"
            value="student"
            id="student"
            checked
          />
          <label for="student">Student</label>

          <input type="radio" name="userType" value="teacher" id="teacher" />
          <label for="teacher">Teacher</label>

          <input type="radio" name="userType" value="admin" id="admin" />
          <label for="admin">Admin</label>
        </div>

        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter username" />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginpassword" placeholder="Enter password" />
        </div>

        <button type="submit" class="login-btn">Login</button>
        <p style="text-align:center; margin-top:15px;">
  Don't have an account?
  <a href="signup.html">Sign up</a>
</p>

      </form>

    </script>
    <script src="script.js"></script>
  </body>
</html>
